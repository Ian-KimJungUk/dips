server {
    listen 80;

    # Docker 내장 DNS. 변수로 proxy_pass하면 요청 시점에 이름을 해석하므로
    # 아직 없는 컨테이너 이름 때문에 nginx 기동이 실패하지 않음
    resolver 127.0.0.11 valid=10s;

    location / {
        # deploy.sh가 생성: set $app_upstream app-blue; 또는 app-green;
        include /etc/nginx/conf.d/active.inc;
        proxy_pass http://$app_upstream:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
