name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # postinstall(prisma generate)은 DB에 접속하지 않지만 prisma.config.ts가 DATABASE_URL을 요구함
  DATABASE_URL: postgres://placeholder

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Testcontainers가 러너의 Docker로 PostgreSQL/Redis를 띄움
      - run: pnpm test:e2e

  # 이미지 빌드 안에서 pnpm build(nest build)가 실행되므로 별도 build job은 두지 않음
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # PR에서는 이미지 빌드만 확인하고, main push일 때만 GHCR에 올림
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 두 이미지가 같은 캐시 scope를 쓰면 서로 덮어쓰므로 분리
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app,ignore-error=true
      # 마이그레이션 이미지: 앱과 같은 커밋 태그로 올려 배포 시 버전을 맞춤
      - id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-migrate
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate,ignore-error=true
